name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The self-hosted auth helper reads this file; generated here so the API key stays out of git.
      - run: node -e 'const fs=require("fs");const c=JSON.parse(process.env.CONFIG);if(!c.apiKey)throw new Error("apiKey missing");fs.mkdirSync("public/__/firebase",{recursive:true});fs.writeFileSync("public/__/firebase/init.json",JSON.stringify(c))'
        env:
          CONFIG: ${{ vars.NEXT_PUBLIC_FIREBASE_CONFIG }}
      - run: npm run build
        env:
          # Public Firebase web config (JSON from `firebase apps:sdkconfig`); a repo variable, not a secret.
          NEXT_PUBLIC_FIREBASE_CONFIG: ${{ vars.NEXT_PUBLIC_FIREBASE_CONFIG }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
